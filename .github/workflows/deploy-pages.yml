name: Deploy Deespark Wellness to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify supplied image assets
        run: |
          for file in \
            deespark-logo-original.png \
            deenormalizer-original.png \
            orzaklin-original.png \
            invekior-original.png \
            glasses-look-one-original.jpeg \
            glasses-look-two-original.png \
            deespark-paper-grain.jpg \
            deespark-hero-botanical-paper.jpg \
            deespark-eyewear-surface.jpg; do
            test -f "client/public/assets/$file" || { echo "Missing required asset: client/public/assets/$file"; exit 1; }
          done
      - name: Build static site
        run: pnpm build:github
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
